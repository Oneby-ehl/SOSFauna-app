name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches:
      - production

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web PWA
        run: npm run build:web:pwa

      - name: Prepare GitHub Pages 404 page
        run: |
          node -e "const fs = require('fs'); const source = 'dist/+not-found.html'; const target = 'dist/404.html'; if (!fs.existsSync(source)) { throw new Error('No se ha encontrado dist/+not-found.html.'); } fs.copyFileSync(source, target); console.log('dist/404.html generado desde dist/+not-found.html');"

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/production'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
